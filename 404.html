<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeBox+ | Streaming Premium (PC Optimizado)</title>
    <meta name="theme-color" content="#0f171e">
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://unpkg.com/videojs-contrib-hls@5.16.1/dist/videojs-contrib-hls.js"></script> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* ------------------------------------------- */
        /* 🎨 CSS GLOBAL Y VARIABLES - ESTILO AMAZON PRIME VIDEO */
        /* ------------------------------------------- */
        *{ box-sizing:border-box; margin:0; padding:0; }
        :root{ 
            /* Colores */
            --bg-primary: #0f171e; 
            --bg-card: #1a242f; 
            --bg-darker: #000000; 
            --text: #ffffff; 
            --muted: #aeb4c6; 
            --accent: #00a8e1; 
            --accent-2: #4ec2e7; 
            --shadow-dark: rgba(0, 0, 0, 0.9); 
            
            /* Layout PC */
            --nav-width: 80px; /* Ancho para el menú vertical */
            --content-padding: 30px; /* Padding lateral fijo para desktop */
            --watched-color: #3b4d61; 
        } 
        /* 🚀 BASE: Ajuste para PC/Portátil */
        body, html{ 
            font-family:'Inter','Poppins',sans-serif; 
            background:var(--bg-primary); 
            color:var(--text); 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            scroll-behavior:smooth; 
            line-height:1.45; 
        } 
        /* 🖥️ Layout principal de PC */
        main{ 
            position: absolute; 
            top: 0; 
            left: var(--nav-width); 
            right: 0; 
            bottom: 0; 
            overflow: hidden; 
        } 
        /* Vistas con scroll interno */
        #mainView, #searchView, #detailView, #playerView { 
            height: 100%; 
            width: 100%; 
            overflow-y: auto; 
            overflow-x: hidden; 
            position: relative; 
            padding-bottom: 20px; 
            scroll-behavior: smooth; 
        } 
        /* Padding horizontal para vistas de contenido */
        #mainView, #searchView, #detailView > .detail-header, #detailView > .detail-main, #detailView > .episodes, #detailView > #recommendationsSection {
            padding-left: var(--content-padding);
            padding-right: var(--content-padding);
        }

        /* ------------------------------------------- */
        /* 🧭 MENÚ DE NAVEGACIÓN VERTICAL (SideNav) */
        /* ------------------------------------------- */
        #sideNav { 
            position: fixed; top: 0; left: 0; width: var(--nav-width); height: 100%; 
            background: var(--bg-darker); border-right: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 4px 0 15px var(--shadow-dark); display: flex; flex-direction: column; 
            align-items: center; z-index: 200; padding-top: 20px;
        } 
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 12px 0; width: 100%; color: var(--muted); font-size: 0.75rem; 
            font-weight: 500; cursor: pointer; user-select: none; margin-bottom: 15px;
            transition: color 0.3s, background-color 0.3s, border-left-color 0.3s; 
        } 
        .nav-item i { font-size: 1.5rem; margin-bottom: 5px; } 
        .nav-item.active { color: var(--text); background-color: var(--bg-card); border-left: 3px solid var(--accent); } 
        .nav-item:hover { color: var(--text); background-color: var(--bg-card); outline: none; } 
        
        /* ------------------------------------------- */
        /* 🔎 VISTA DE BUSCADOR */
        /* ------------------------------------------- */
        #searchView { 
            position: fixed; inset: 0; left: var(--nav-width); background: var(--bg-primary); z-index: 55; padding-top: 40px; display: none; 
            animation: fadeIn .3s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
        } 
        @keyframes fadeIn {from{opacity:0; transform: translateY(10px);} to{opacity:1; transform: translateY(0);}}
        #searchHeader { 
            display: flex; align-items: center; gap: 10px; margin-bottom: 30px; 
            position: sticky; top: 0; z-index: 60; padding-top: 20px; padding-bottom: 10px; 
            background: var(--bg-primary); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); 
        } 
        #searchInput { 
            flex-grow: 1; padding: 12px 18px; border-radius: 6px; border: 2px solid var(--bg-card); 
            font-size: 1.1rem; background: var(--bg-card); color: var(--text); 
            transition: border-color .3s, box-shadow .3s; 
        } 
        #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent); outline: none; } 
        #searchResultsTitle { font-size: 1.8rem; margin-bottom: 20px; font-weight: 600; } 
        #searchResultsGrid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; 
        } 
        
        /* ------------------------------------------- */
        /* 🎬 SECCIONES DE CONTENIDO (Home/Grid) */
        /* ------------------------------------------- */
        #mainView { padding-top: 20px; } 
        .content-section { padding: 25px 0 10px 0; margin-bottom: 10px; } 
        .section-title { font-size: 2rem; font-weight: 700; margin-bottom: 15px; border-left: 4px solid var(--accent); padding-left: 14px; } 
        /* SLIDER DE SCROLL HORIZONTAL */
        .horizontal-scroll { 
            display: flex; overflow-x: scroll; 
            padding: 10px 0; gap: 20px; -webkit-overflow-scrolling: touch; 
            scroll-snap-type: x mandatory; scroll-behavior: smooth; 
        } 
        .horizontal-scroll::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        /* 🃏 Tarjeta (Card) - Ajuste para PC */
        .card{
            flex: 0 0 180px; 
            height: auto;
            background:var(--bg-card); 
            border-radius:4px; 
            overflow:hidden; 
            cursor:pointer; 
            transition:transform .3s, box-shadow .3s, opacity .5s; 
            opacity:0; 
            box-shadow:0 1px 4px rgba(0,0,0,.5);
        }
        .card.show{ opacity:1; transform: scale(1); } 
        .card:hover{ 
            transform:scale(1.08); 
            box-shadow:0 10px 20px var(--shadow-dark); 
            z-index: 10; 
            outline: 2px solid var(--accent);
        } 
        .card img{ 
            display:block; width:100%; height:250px; object-fit:cover; 
            transition:transform .3s; 
        } 
        .card:hover img{ transform: scale(1.05); } 

        /* Grid de resultados y paginación */
        #dynamicGrid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; 
        } 

        /* 🌟 HERO/HEADER */
        .hero-static-container { position: relative; width: 100%; margin-bottom: 40px; height: 450px; overflow: hidden; border-radius: 8px; } 
        .detail-hero-container { position: relative; width: 100%; height: 350px; overflow: hidden; z-index: 2; border-radius: 8px; } 
        .hero-overlay { padding: 40px var(--content-padding); } 
        .hero-overlay h1, .detail-hero-overlay h1 { font-size: 3rem; } 
        .detail-hero-overlay { padding: 40px var(--content-padding); }

        /* ------------------------------------------- */
        /* 🖼️ VISTA DE DETALLE (INMERSIVA) */
        /* ------------------------------------------- */
        #detailView{ 
            left: var(--nav-width); 
            z-index:200; 
            display:none; 
            animation:fade .3s;
            background: var(--bg-primary); 
        } 
        #detailBackground { position: fixed; left: var(--nav-width); width: calc(100% - var(--nav-width)); } 
        .detail-header{ 
            position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:20px; padding:20px var(--content-padding); 
            background:rgba(15, 23, 30, 0.95); backdrop-filter:blur(10px); box-shadow:0 2px 10px rgba(0,0,0,.5); 
        } 
        .detail-main{ 
            display:flex; flex-wrap:wrap; gap:40px; padding:40px var(--content-padding); padding-top: 10px; 
        } 
        .details{flex:1 1 600px;} 
        .episodes{ 
            margin-top:30px; padding-top:20px; border-top:1px solid rgba(255,255,255,.15); 
        } 
        .episodes h3{ margin-bottom:15px; font-size:1.4rem; } 
        .episodes-list{ 
            display: flex; overflow-x: scroll; 
            padding: 10px 0; gap: 20px; 
            scroll-snap-type: x mandatory; 
        } 
        .episode-item{ width: 350px; } 
        .episode-thumb{ height: 200px; } 

        /* ------------------------------------------- */
        /* 🎥 VISTA DEL REPRODUCTOR (HLS) */
        /* ------------------------------------------- */
        #playerView {
            position: fixed; inset: 0; left: var(--nav-width); background: var(--bg-darker); 
            z-index: 300; display: none; padding: 0;
        }
        .player-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-darker);
            position: relative;
        }
        /* Botón de volver del reproductor */
        #closePlayerBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent);
            color: var(--text);
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 1rem;
            z-index: 10;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #closePlayerBtn:hover {
            background: var(--accent-2);
        }
        /* Estilo del reproductor de Video.js (Ajuste a contenedor) */
        .video-js {
            width: 100%;
            height: 100%;
            min-height: 400px; /* Mínimo de altura para PC */
        }
        
        /* Estilos menores */
        .btn{ border:0; background:var(--accent); color:var(--text); padding:10px 18px; border-radius:4px; font-weight:600; cursor:pointer; transition: transform .2s, background-color .2s; } 
        .btn:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow: 0 4px 10px rgba(0,0,0,0.3); outline: none;}
    </style>
</head>
<body>
    
    <nav id="sideNav">
        <div class="nav-item active" data-tab="home">
            <i class="fas fa-house-chimney"></i> 
            <span>Inicio</span>
        </div>
        <div class="nav-item" data-tab="series">
            <i class="fas fa-clapperboard"></i> 
            <span>Series</span>
        </div>
        <div class="nav-item" data-tab="movies">
            <i class="fas fa-film"></i> 
            <span>Películas</span>
        </div>
        <div class="nav-item" data-tab="channels">
            <i class="fas fa-tv"></i> 
            <span>Canales</span>
        </div>
        <div class="nav-item" data-tab="favorites">
            <i class="fas fa-heart"></i> 
            <span>Favoritos</span>
        </div>
        <div class="nav-item" data-tab="search">
            <i class="fas fa-search"></i> 
            <span>Buscar</span>
        </div>
    </nav>

    <main>
        <div id="mainView">
            <div id="content"> 
                </div>
            
            <div id="gridContainer" style="min-height: 100px;"> 
                <h2 id="gridTitle" class="section-title" style="display:none; padding-top: 20px;"></h2>
                <div id="dynamicGrid"></div>
            </div>

            <div id="loadingIndicator">
                <i class="fas fa-spinner"></i> Cargando más contenido...
            </div>
        </div>

        <div id="searchView">
            <div id="searchHeader">
                <input type="text" id="searchInput" placeholder="Buscar contenido, género...">
            </div>
            <h2 id="searchResultsTitle"></h2>
            <div id="searchResultsGrid">
                <p style="color:var(--muted); padding: 50px 0; text-align: center;">Escribe al menos dos caracteres para iniciar la búsqueda.</p>
            </div>
        </div>
    </main>

    <div id="detailBackground">
        <img id="detailBackgroundImage" src="" alt="Fondo de la portada">
    </div>

    <div id="detailView">
        <div class="detail-header">
            <button id="backBtn" class="btn">❮ Volver</button>
            <h2 id="detailTitle" class="detail-title"></h2>
        </div>
        
        <div id="detailHeroContainer" class="detail-hero-container">
            <img id="detailHeroImage" src="" alt="Portada de la serie/película">
            <div class="detail-hero-overlay">
                <h1 id="detailHeroTitle"></h1>
            </div>
        </div>
        
        <div class="detail-main">
            <div class="details">
                <div id="detailActionButtons">
                    <button id="reproduceBtn" style="display:none;"></button>
                    <button id="favoriteBtn"><i class="fas fa-heart"></i></button>
                </div>
                <p id="detailDesc"></p>
                <p id="detailGenres"></p>
            </div>
        </div>
        
        <div id="detailEpisodes" class="episodes content-section">
            <h3>Capítulos</h3>
            <div class="episodes-list horizontal-scroll"> 
            </div>
        </div>
        
        <div id="recommendationsSection" class="content-section">
            <h2 class="section-title">Recomendaciones</h2>
            <div class="horizontal-scroll" id="recommendationsScroll"> 
            </div>
        </div>
    </div>
    
    <div id="playerView">
        <button id="closePlayerBtn">❮ Volver al Detalle</button>
        <div class="player-container">
            <video
                id="hlsPlayer"
                class="video-js vjs-default-skin"
                controls
                preload="auto"
                data-setup='{}'>
                </video>
        </div>
    </div>

    <script>
        // --- CONSTANTES Y VARIABLES ---
        const ANIME_JSON = "https://raw.githubusercontent.com/R3D-GHOST/json/refs/heads/main/data.json";
        const M3U8_URL = "https://raw.githubusercontent.com/R3D-GHOST/json/refs/heads/main/CV.m3u8";
        
        let contentData = [], series = [], movies = [], channels = [];
        let currentTab = 'home', currentItem = null;
        let allContent = [];

        // PAGINACIÓN
        const itemsPerLoad = 30;
        let currentPage = 0;
        let currentList = [];
        let isPaginating = false; 

        // DOM REFERENCES
        const content = document.getElementById('content');
        const detailView = document.getElementById('detailView');
        const detailBackground = document.getElementById('detailBackground');
        const sideNavItems = document.querySelectorAll('#sideNav .nav-item');
        const mainView = document.getElementById('mainView');
        const searchView = document.getElementById('searchView');
        const searchInput = document.getElementById('searchInput');
        const dynamicGrid = document.getElementById('dynamicGrid');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const playerView = document.getElementById('playerView');
        const closePlayerBtn = document.getElementById('closePlayerBtn');
        const reproduceBtn = document.getElementById('reproduceBtn');
        const episodesListContainer = document.querySelector('.episodes-list');
        
        let player = null;


        // ----------------------------------------------------
        // --- FUNCIONES DE ESTADO Y CACHE (SIMPLIFICADAS) ---

        function getLastWatchedEpisodeIndex(seriesId, episodeIndex = undefined) { 
            // Implementación de LocalStorage para progreso
            try { 
                const progress = localStorage.getItem('animebox_progress'); 
                let progressData = progress ? JSON.parse(progress) : {}; 
                if (episodeIndex !== undefined) { 
                    progressData[seriesId] = episodeIndex; 
                    localStorage.setItem('animebox_progress', JSON.stringify(progressData)); 
                    return episodeIndex; 
                } else { 
                    return progressData[seriesId]; 
                } 
            } catch(e) { return undefined; } 
        } 
        function isEpisodeWatched(seriesId, episodeIndex) { 
            // Implementación de LocalStorage para episodios vistos
            try { 
                const watched = JSON.parse(localStorage.getItem('animebox_watched') || '{}'); 
                return watched[seriesId] && watched[seriesId].includes(episodeIndex); 
            } catch(e) { return false; } 
        } 
        function saveWatchedEpisode(seriesId, episodeIndex) { 
            // Guarda el episodio como visto
            try {
                let watched = JSON.parse(localStorage.getItem('animebox_watched') || '{}'); 
                if (!watched[seriesId]) watched[seriesId] = []; 
                if (!watched[seriesId].includes(episodeIndex)) { 
                    watched[seriesId].push(episodeIndex); 
                    localStorage.setItem('animebox_watched', JSON.stringify(watched)); 
                }
            } catch(e) { console.error("Error saving watched:", e); }
        }
        function getFavorites() { 
            // Obtener lista de favoritos
            try { return JSON.parse(localStorage.getItem('animebox_favorites') || '[]'); } catch(e) { return []; } 
        } 
        function toggleFavorite(item) { 
            // Alternar el estado de favorito
            let favs = getFavorites(); 
            const itemId = item.id || item.title; 
            const index = favs.findIndex(fav => (fav.id || fav.title) === itemId); 
            const favoriteBtn = document.getElementById('favoriteBtn');
            const itemToSave = { ...item, id: itemId }; 

            if (index > -1) { 
                favs.splice(index, 1); 
                if (favoriteBtn) favoriteBtn.classList.remove('active'); 
                if(currentTab === 'favorites') renderCurrentTab(); 
            } else { 
                favs.push(itemToSave); 
                if (favoriteBtn) favoriteBtn.classList.add('active'); 
            } 
            localStorage.setItem('animebox_favorites', JSON.stringify(favs)); 
        } 

        // ----------------------------------------------------
        // --- MANEJO DE DATOS ---

        async function fetchData(){ 
            // Cargar datos principales y canales
            try { 
                loadingIndicator.classList.add('show');
                contentData = await (await fetch(ANIME_JSON)).json(); 
                series = contentData.filter(item => item.episodes && item.episodes.length > 0); 
                movies = contentData.filter(item => !item.episodes || item.episodes.length === 0); 
                await fetchChannels(); 
                allContent = [...contentData, ...channels]; 
                loadingIndicator.classList.remove('show');
                renderCurrentTab(); 
            } catch(e){ 
                console.error("Error al cargar los datos:", e); 
                content.innerHTML = `<p style="color:var(--accent); padding: 50px 0; text-align: center;">❌ Error al cargar los datos. Intenta recargar la página.</p>`; 
                loadingIndicator.classList.remove('show');
            } 
        } 
        async function fetchChannels(){ 
            // Lógica simplificada para parsear el M3U
            try { 
                const res = await fetch(M3U8_URL); 
                const text = await res.text(); 
                const lines = text.split(/\r?\n/); 
                let current = null; channels=[]; 
                for(const lineRaw of lines){ 
                    const line = lineRaw.trim(); 
                    if(!line.startsWith('#') && line.length > 0 && line.includes('://')) { 
                        if (current) {
                            current.video_url = line;
                            channels.push(current);
                        }
                        current = null;
                        continue;
                    }
                    if(line.startsWith('#EXTINF:')){ 
                        const logo = (line.match(/tvg-logo="([^"]*)"/)||[])[1]||null; 
                        const name = (line.match(/,(.*)$/)||[])[1]?.trim()||'Canal'; 
                        const coverImage = logo || 'https://via.placeholder.com/180x250?text=TV'; 
                        current = {id:name,title:name,coverImage,logo,type:'channel',isChannel:true, video_url:'', genre: ['En Vivo', 'Canal']}; 
                    } 
                } 
            } catch(e){ 
                console.error("Error al cargar canales:", e); 
                channels=[]; 
            } 
        } 
        function getRecommendations(item) { 
            if (!item) return []; 
            const currentId = item.id || item.title; 
            const currentGenre = item.genre || []; 
            
            // Filtra y recomienda por género o tipo (series/películas)
            let filteredContent = allContent.filter(i => (i.id || i.title) !== currentId); 
            let genreRecs = filteredContent 
                .filter(i => i.genre && i.genre.some(g => currentGenre.includes(g))) 
                .sort(() => 0.5 - Math.random()) 
                .slice(0, 10); 
            
            return genreRecs;
        } 


        // ----------------------------------------------------
        // --- LÓGICA DE REPRODUCCIÓN (HLS) ---

        function getMimeType(url) {
            const lowerUrl = url.toLowerCase();
            if (lowerUrl.includes('.m3u8')) return 'application/x-mpegURL';
            if (lowerUrl.includes('.mp4')) return 'video/mp4'; 
            // Para otros formatos, Video.js intentará reproducir nativamente
            return 'application/x-mpegURL'; 
        }

        function playContent(videoUrl) {
            if (!videoUrl) {
                alert('URL de video no disponible.');
                return;
            }

            showView('playerView');
            detailBackground.classList.remove('show');
            
            if (!player) {
                player = videojs('hlsPlayer');
                // Asegurar que el reproductor se destruya al cerrarse para liberar recursos
                player.on('dispose', () => player = null); 
            }
            
            const mimeType = getMimeType(videoUrl);
            player.src({ src: videoUrl, type: mimeType });
            
            player.ready(function() {
                this.play();
            });
        }
        
        function closePlayerAndUpdateDetail() {
            // Detener y destruir el reproductor
            if (player) {
                player.pause();
                player.dispose(); // Destruye completamente la instancia
            }
            playerView.style.display = 'none';
            
            // Volver a la vista de detalle o principal
            if (currentItem) {
                openDetail(currentItem); // Reabrir para actualizar estado de "Continuar Viendo"
            } else {
                renderCurrentTab(); 
            }
        }
        closePlayerBtn.onclick = closePlayerAndUpdateDetail;


        // ----------------------------------------------------
        // --- RENDERIZADO DE VISTAS ---

        function showView(viewId) { 
            // Control de vistas (simultáneamente solo se ve una)
            const views = [mainView, searchView, detailView, playerView];
            views.forEach(v => v.style.display = 'none'); 

            document.getElementById(viewId).style.display = 'block'; 
        } 

        function renderCurrentTab(){ 
            // Lógica de navegación principal
            sideNavItems.forEach(b => b.classList.remove('active')); 
            const activeNavButton = document.querySelector(`#sideNav .nav-item[data-tab="${currentTab}"]`);
            if (activeNavButton) activeNavButton.classList.add('active'); 
            
            mainView.scrollTo({top: 0, behavior: 'instant'}); 

            if (currentTab === 'search') { 
                showView('searchView'); 
                searchInput.focus(); 
                handleSearchInput();
                return; 
            } 
            
            showView('mainView'); 
            content.innerHTML = '';
            dynamicGrid.innerHTML = '';
            document.getElementById('gridTitle').style.display = 'none';
            
            let list = [];
            let title = '';

            if(currentTab === 'home'){ 
                renderHomePage(); 
                return;
            } else if (currentTab === 'series') { 
                list = series; title = 'Todas las Series'; 
            } else if (currentTab === 'movies') { 
                list = movies; title = 'Todas las Películas'; 
            } else if (currentTab === 'channels') { 
                list = channels; title = 'Todos los Canales en Vivo'; 
            } else if (currentTab === 'favorites') { 
                list = getFavorites(); title = 'Mis Favoritos'; 
            } 
            
            setupGridPage(list, title);
        } 

        sideNavItems.forEach(btn => btn.onclick = () => { 
            currentTab = btn.dataset.tab; 
            renderCurrentTab(); 
        }); 

        function renderHomePage() { 
            // Renderizar el Hero
            const featuredItem = allContent[0]; 
            if (featuredItem) { 
                const heroElement = renderStaticHero(featuredItem); 
                if (heroElement) content.appendChild(heroElement); 
            } 
            
            // Renderizar secciones horizontales
            const sections = [ 
                { title: ' Canales en Vivo', list: channels.slice(0, 10) }, 
                { title: ' Infantil', genre: 'Infantil' }, 
                { title: ' Romance', genre: 'Romance' }, 
                { title: ' Más Vistas', list: [...series, ...movies].sort(() => 0.5 - Math.random()).slice(0, 10) },
            ]; 

            sections.forEach((section) => { 
                let list = section.list || []; 
                if (section.genre) { 
                    list = allContent.filter(a => a.genre && a.genre.some(g => g === section.genre)).sort(() => 0.5 - Math.random()).slice(0, 10); 
                } 
                if (list.length > 0) { 
                    const sectionDiv = document.createElement('div'); 
                    sectionDiv.className = 'content-section'; 
                    sectionDiv.innerHTML = `<h2 class="section-title">${section.title}</h2><div class="horizontal-scroll"></div>`;
                    const scrollDiv = sectionDiv.querySelector('.horizontal-scroll');
                    list.forEach(item => scrollDiv.appendChild(createCardHTML(item))); 
                    content.appendChild(sectionDiv); 
                } 
            }); 
        } 

        function createCardHTML(item) { 
            // Crea una tarjeta de contenido
            const cover = item.coverImage || item.logo || 'https://via.placeholder.com/180x250?text=Portada'; 
            const spanText = item.isChannel ? 'En vivo' : (item.genre ? item.genre[0] : ''); 
            const card = document.createElement('div'); 
            card.className = 'card'; 
            card.tabIndex = 0;
            card.innerHTML = `<img src="${cover}" alt="${item.title}" onerror="this.onerror=null;this.src='https://via.placeholder.com/180x250?text=Portada';"><div class="info"><h3>${item.title}</h3><span>${spanText}</span></div>`; 
            card.onclick = () => openDetail(item); 
            setTimeout(() => card.classList.add('show'), Math.random() * 50); 
            return card; 
        } 

        function renderStaticHero(item) { 
            // Crea el Hero Banner
            const container = document.createElement('div'); 
            container.className = 'hero-static-container'; 
            const heroCover = item.coverImage || 'https://via.placeholder.com/1200x450?text=Última Novedad'; 
            const itemId = item.id || item.title; 
            container.innerHTML = ` 
                <img src="${heroCover}" alt="${item.title}" onerror="this.onerror=null;this.src='https://via.placeholder.com/1200x450?text=Última Novedad';"> 
                <div class="hero-overlay"> 
                    <h1>${item.title}</h1> 
                    <p>${item.description || 'La última adición a nuestro catálogo premium. ¡No te la pierdas!'}</p> 
                    <button class="play-button-hero" onclick="openDetail(allContent.find(i => (i.id || i.title) === '${itemId}'))"> 
                        <i class="fas fa-play"></i> Reproducir Ahora 
                    </button> 
                </div> 
            `; 
            return container; 
        } 

        // Lógica de carga infinita (Paginación)
        function loadMoreItems(list) {
            if (isPaginating) return; 
            isPaginating = true;
            
            const startIndex = currentPage * itemsPerLoad;
            const endIndex = startIndex + itemsPerLoad;
            const itemsToLoad = list.slice(startIndex, endIndex);

            if (itemsToLoad.length === 0) {
                loadingIndicator.innerHTML = `Fin del catálogo (${list.length} resultados).`;
                setTimeout(() => { loadingIndicator.classList.remove('show'); isPaginating = false; }, 1000);
                return;
            }
            
            if (currentPage > 0) loadingIndicator.classList.add('show');

            const fragment = document.createDocumentFragment();
            itemsToLoad.forEach(item => fragment.appendChild(createCardHTML(item)));
            dynamicGrid.appendChild(fragment);

            currentPage++;
            isPaginating = false;
            
            loadingIndicator.innerHTML = `Mostrando ${dynamicGrid.children.length} de ${list.length} resultados.`;
            setTimeout(() => loadingIndicator.classList.remove('show'), 300);
        }

        function setupGridPage(list, titleText) {
            document.getElementById('gridTitle').textContent = titleText;
            document.getElementById('gridTitle').style.display = 'block';
            currentList = list;
            currentPage = 0; 
            loadMoreItems(list);
        }
        mainView.addEventListener('scroll', () => {
            if (currentTab === 'home' || currentTab === 'search' || isPaginating) return;
            const scrollThreshold = 300; 
            if (mainView.scrollTop + mainView.clientHeight >= mainView.scrollHeight - scrollThreshold) {
                if (dynamicGrid.children.length < currentList.length) loadMoreItems(currentList);
            }
        });


        // ----------------------------------------------------
        // --- DETALLE DE CONTENIDO ---

        function openDetail(item){ 
            currentItem=item; 
            const coverUrl = item.coverImage || item.logo || 'https://via.placeholder.com/180x250?text=Portada'; 
            const seriesId = item.id || item.title; 

            // Mostrar y configurar vista
            document.getElementById('detailBackgroundImage').src = coverUrl; 
            detailBackground.classList.add('show'); 
            showView('detailView'); 
            detailView.scrollTo({top: 0, behavior: 'instant'}); 

            document.getElementById('detailHeroImage').src = coverUrl; 
            document.getElementById('detailHeroTitle').textContent = item.title; 
            document.getElementById('detailTitle').textContent=item.title; 
            document.getElementById('detailDesc').textContent=item.description||'No hay descripción disponible para este contenido.'; 
            document.getElementById('detailGenres').textContent=Array.isArray(item.genre)&&item.genre.length?'🎭 '+item.genre.join(', '):''; 
            
            // Botón Favoritos
            document.getElementById('favoriteBtn').onclick = () => toggleFavorite(item); 
            const isFav = getFavorites().some(fav => (fav.id || fav.title) === seriesId);
            document.getElementById('favoriteBtn').classList.toggle('active', isFav);

            // Lógica de Reproducción (Series vs Películas/Canales)
            episodesListContainer.innerHTML=''; 
            reproduceBtn.style.display = 'none'; 
            document.getElementById('detailEpisodes').style.display = 'block'; 
            const isSeries = item.episodes && item.episodes.length > 0; 

            if(isSeries){ 
                // Lógica de Series: Continuar viendo y listado de capítulos
                let lastWatchedIndex = getLastWatchedEpisodeIndex(seriesId); 
                let nextEpisodeIndex = lastWatchedIndex !== undefined ? lastWatchedIndex + 1 : 0; 
                nextEpisodeIndex = Math.min(nextEpisodeIndex, item.episodes.length - 1); 
                nextEpisodeIndex = Math.max(0, nextEpisodeIndex); 
                
                reproduceBtn.style.display = 'flex'; 
                const btnText = (lastWatchedIndex !== undefined && lastWatchedIndex < item.episodes.length - 1) 
                    ? `<i class="fas fa-forward"></i> Continuar viendo (Cap. ${nextEpisodeIndex + 1})`
                    : `<i class="fas fa-play"></i> Ver Ahora (Cap. 1)`;

                reproduceBtn.innerHTML = btnText;
                reproduceBtn.onclick = () => {
                    const episodeElement = episodesListContainer.children[nextEpisodeIndex];
                    if(episodeElement) episodeElement.click();
                    else playContent(item.episodes[nextEpisodeIndex].video_url); 
                };
                
                // Renderizar Episodios
                item.episodes.forEach((ep,i)=>{ 
                    const isWatched = isEpisodeWatched(seriesId, i); 
                    const episodeItem = document.createElement('div'); 
                    const isActive = i === nextEpisodeIndex;
                    episodeItem.className = `episode-item ${isWatched ? 'watched' : ''} ${isActive ? 'active' : ''}`; 
                    const thumbUrl = ep.thumb || item.coverImage || 'https://via.placeholder.com/350x200?text=Episodio'; 
                    const iconClass = isWatched ? 'fas fa-check-circle' : 'fas fa-play-circle'; 
                    episodeItem.innerHTML = `<div class="episode-thumb"><img src="${thumbUrl}" alt="Ep. ${i+1}"><i class="${iconClass} play-icon"></i></div><div class="episode-info"><strong>Episodio ${i+1}: ${ep.title || item.title}</strong><span>${ep.description || 'Sinopsis del episodio...'}</span></div>`; 
                    episodeItem.onclick = () => { 
                        getLastWatchedEpisodeIndex(seriesId, i); 
                        saveWatchedEpisode(seriesId, i); 
                        playContent(ep.video_url); 
                    }; 
                    episodesListContainer.appendChild(episodeItem); 
                    if(isActive) setTimeout(() => episodeItem.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); 
                }); 

            } else if(item.video_url){ 
                // Lógica Películas/Canales
                document.getElementById('detailEpisodes').style.display = 'none'; 
                reproduceBtn.style.display = 'flex'; 
                reproduceBtn.innerHTML = `<i class="fas fa-play"></i> ${item.isChannel ? 'Ver Canal en Vivo' : 'Reproducir Ahora'}`; 
                reproduceBtn.onclick = () => playContent(item.video_url); 
            } else { 
                document.getElementById('detailEpisodes').style.display = 'none'; 
                reproduceBtn.style.display = 'none'; 
            } 
            
            // Recomendaciones
            renderRecommendations(item); 
        } 

        function renderRecommendations(item) { 
            const recommendationsScroll = document.getElementById('recommendationsScroll');
            const recommendationsSection = document.getElementById('recommendationsSection');
            recommendationsScroll.innerHTML = ''; 
            const recommendations = getRecommendations(item); 
            if (recommendations.length > 0) { 
                recommendationsSection.style.display = 'block'; 
                recommendations.forEach(rec => recommendationsScroll.appendChild(createCardHTML(rec))); 
            } else { 
                recommendationsSection.style.display = 'none'; 
            } 
        } 

        document.getElementById('backBtn').onclick=()=>{ 
            detailView.style.display='none'; 
            detailBackground.classList.remove('show'); 
            currentItem = null; 
            renderCurrentTab(); 
        }; 

        // Lógica de Búsqueda
        function handleSearchInput() { 
            const query = searchInput.value.toLowerCase().trim(); 
            const searchResultsGrid = document.getElementById('searchResultsGrid');
            const searchResultsTitle = document.getElementById('searchResultsTitle');
            searchResultsGrid.innerHTML = ''; 
            if (query.length < 2) { 
                searchResultsTitle.textContent = "Búsqueda"; 
                searchResultsGrid.innerHTML = `<p style="color:var(--muted); padding: 50px 0; text-align: center;">Escribe al menos dos caracteres para iniciar la búsqueda.</p>`; 
                return; 
            } 
            const filtered = allContent.filter(item => 
                item.title.toLowerCase().includes(query) || 
                (item.genre && item.genre.some(g => g.toLowerCase().includes(query)))
            ); 
            searchResultsTitle.textContent = `Resultados para "${query}" (${filtered.length})`; 
            if (filtered.length === 0) { 
                searchResultsGrid.innerHTML = `<p style="color:var(--muted); padding: 20px 0; text-align: center;">No se encontraron resultados para "${query}".</p>`; 
            } else { 
                filtered.forEach(item => searchResultsGrid.appendChild(createCardHTML(item))); 
            } 
        } 
        searchInput.addEventListener('input', handleSearchInput); 

        // ----------------------------------------------------
        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded',async()=>{ 
            await fetchData(); 
        });
    </script>
</body>
</html>
