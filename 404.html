<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <title>KAWAII PLAY ULTIMATE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
    --primary: #FF1E42;
    --primary-rgb: 255, 30, 66;
    --bg: #030303;
    --surface: #0f0f0f;
    --card-ratio: 2/3;
    --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg); color: #fff; overflow-x: hidden;
}

/* --- ESTILOS DE CARGA --- */
#loader {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.loader-bar { width: 200px; height: 3px; background: #1a1a1a; margin-top: 20px; border-radius: 10px; overflow: hidden; }
.loader-progress { width: 0%; height: 100%; background: var(--primary); transition: 0.3s; }

/* --- HEADER --- */
header {
    height: 80px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 5%; position: fixed; top: 0; width: 100%; z-index: 2000;
    transition: var(--transition); background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
}
header.scrolled { background: rgba(3,3,3,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }

.nav-left { display: flex; align-items: center; gap: 40px; }
.logo { font-family: 'Space Grotesk'; font-size: 2rem; font-weight: 800; color: var(--primary); text-decoration: none; letter-spacing: -1px; }

.menu { display: flex; gap: 25px; }
.menu a { color: #888; text-decoration: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
.menu a.active, .menu a:hover { color: #fff; }

/* --- BUSCADOR OVERLAY --- */
#search-view {
    position: fixed; inset: 0; background: rgba(3,3,3,0.98); z-index: 4000;
    padding: 100px 5%; display: none; overflow-y: auto;
}
.search-input-wrap { position: relative; max-width: 800px; margin: 0 auto 50px; }
#search-input { width: 100%; background: none; border: none; border-bottom: 2px solid #333; color: #fff; font-size: 2.5rem; font-family: 'Space Grotesk'; font-weight: 700; padding: 10px 0; }
#search-input:focus { border-color: var(--primary); }

/* --- PORTADAS (GRID) --- */
.view { display: none; min-height: 100vh; animation: fadeIn 0.6s ease; }
.view.active { display: block; }

.container { padding: 120px 5% 60px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }

.card {
    position: relative; aspect-ratio: var(--card-ratio); background: #111;
    border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: var(--transition); border: 1px solid rgba(255,255,255,0.05);
}
.card:hover { transform: scale(1.08) translateY(-10px); z-index: 10; border-color: var(--primary); box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
.card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
.card:hover img { filter: brightness(1.1); }

/* BOTON FAVORITOS EN PORTADA */
.fav-btn {
    position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: #fff;
    opacity: 0; transition: 0.3s; z-index: 5;
}
.card:hover .fav-btn { opacity: 1; }
.fav-btn.active { color: var(--primary); opacity: 1; }

/* TV CARDS */
.tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.card-tv { 
    aspect-ratio: 16/9; background: #000; border-radius: 12px; 
    overflow: hidden; cursor: pointer; border: 2px solid #111; transition: 0.3s;
}
.card-tv:hover { border-color: var(--primary); transform: translateY(-5px); }
.card-tv img { width: 100%; height: 100%; object-fit: contain; padding: 30px; }

/* --- REPRODUCTOR --- */
#player { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }
.p-header { position: absolute; top: 0; width: 100%; padding: 30px 5%; z-index: 10; display: flex; justify-content: space-between; }
.p-layout { display: grid; height: 100vh; padding: 100px 5% 40px; gap: 30px; }
.is-serie { grid-template-columns: 1fr 400px; }
.video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; }
video { width: 100%; height: 100%; }

.side { background: var(--surface); border-radius: 15px; padding: 25px; overflow-y: auto; }
.ep { display: flex; gap: 15px; padding: 12px; border-radius: 10px; cursor: pointer; margin-bottom: 12px; transition: 0.3s; border: 1px solid transparent; }
.ep.active { background: rgba(var(--primary-rgb), 0.1); border-color: var(--primary); }
.ep img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; }

/* --- TOAST NOTIFICATION --- */
#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 12px 30px; border-radius: 50px; font-weight: 800; font-size: 0.9rem; z-index: 6000; display: none; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translate(-50%, 50px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div id="loader">
    <div class="logo">KAWAII</div>
    <div class="loader-bar"><div id="lp" class="loader-progress"></div></div>
</div>

<header id="h">
    <div class="nav-left">
        <a href="#" class="logo" onclick="showView('home')">KAWAII</a>
        <nav class="menu">
            <a onclick="showView('home')" id="m-home" class="active">Inicio</a>
            <a onclick="showView('series')" id="m-series">Series</a>
            <a onclick="showView('movies')" id="m-movies">Películas</a>
            <a onclick="showView('tv')" id="m-tv">Canales</a>
            <a onclick="showView('favs')" id="m-favs">Mi Lista</a>
        </nav>
    </div>
    <i class="fas fa-search" onclick="toggleSearch()" style="cursor:pointer; font-size:1.3rem;"></i>
</header>

<div id="search-view">
    <div class="search-input-wrap">
        <input type="text" id="search-input" placeholder="Títulos, géneros, canales..." oninput="runSearch()">
        <i class="fas fa-times" onclick="toggleSearch()" style="position:absolute; right:0; top:20px; font-size:2rem; cursor:pointer;"></i>
    </div>
    <div id="search-results" class="grid"></div>
</div>

<div id="v-home" class="view active">
    <div id="hero" style="height:80vh; background-size:cover; background-position:center; display:flex; align-items:center; padding:0 6%; position:relative;">
        <div style="position:absolute; inset:0; background:linear-gradient(to right, #030303, transparent), linear-gradient(to top, #030303, transparent);"></div>
        <div style="position:relative; z-index:10; max-width:700px;">
            <h1 id="hero-title" style="font-family:'Space Grotesk'; font-size:4.5rem; margin:0; line-height:0.9;">--</h1>
            <div style="margin-top:30px; display:flex; gap:15px;">
                <button onclick="playHero()" style="padding:15px 40px; border-radius:50px; border:none; background:#fff; color:#000; font-weight:800; cursor:pointer; font-size:1rem;"><i class="fas fa-play"></i> REPRODUCIR</button>
            </div>
        </div>
    </div>
    <div style="padding: 40px 5%;">
        <h2 style="font-family:'Space Grotesk'; margin-bottom:25px;">Agregados recientemente</h2>
        <div id="home-recent" class="grid"></div>
    </div>
</div>

<div id="v-grid" class="view">
    <div class="container">
        <h1 id="grid-title" style="font-family:'Space Grotesk'; font-size:3rem; margin:0 0 40px;">Catálogo</h1>
        <div id="main-grid" class="grid"></div>
        <div id="sentinel" style="height:100px;"></div>
    </div>
</div>

<div id="v-tv" class="view">
    <div class="container">
        <h1 style="font-family:'Space Grotesk'; font-size:3rem; margin:0 0 40px;">Televisión en Vivo</h1>
        <div id="tv-grid" class="tv-grid"></div>
    </div>
</div>

<div id="player">
    <div class="p-header">
        <div onclick="closePlayer()" style="cursor:pointer; font-weight:800; background:rgba(255,255,255,0.1); padding:10px 25px; border-radius:50px; backdrop-filter:blur(10px);"><i class="fas fa-chevron-left"></i> VOLVER</div>
        <div id="p-title" style="color:var(--primary); font-weight:800; letter-spacing:1px;"></div>
    </div>
    <div id="p-layout" class="p-layout">
        <div class="video-wrap"><video id="vo" controls autoplay></video></div>
        <div id="p-side" class="side">
            <h3 style="margin-top:0; font-family:'Space Grotesk'; color:var(--primary);">EPISODIOS</h3>
            <div id="ep-list"></div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
const URLS = {
    DATA: "https://raw.githubusercontent.com/R3D-GHOST/json/refs/heads/main/data.json",
    M3U: "https://raw.githubusercontent.com/R3D-GHOST/json/refs/heads/main/CV.m3u8"
};

let db = [], filtered = [], favs = JSON.parse(localStorage.getItem('k_favs') || '[]');
let history = JSON.parse(localStorage.getItem('k_history') || '{}');
let itemsCount = 0, hHero = null, hls = null;

async function start() {
    try {
        const [r1, r2] = await Promise.all([fetch(URLS.DATA).then(r=>r.json()), fetch(URLS.M3U).then(r=>r.text())]);
        db = [...r1, ...parseM3U(r2)];
        
        // Setup UI
        hHero = r1[0];
        document.getElementById('hero').style.backgroundImage = `url(${hHero.poster || hHero.coverImage})`;
        document.getElementById('hero-title').innerText = hHero.title;
        document.getElementById('home-recent').innerHTML = r1.slice(1, 13).map(i => createCard(i)).join('');
        
        // Loader finish
        document.getElementById('lp').style.width = '100%';
        setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        
        // Infinite scroll
        const observer = new IntersectionObserver(e => {
            if(e[0].isIntersecting && document.getElementById('v-grid').classList.contains('active')) renderBatch();
        });
        observer.observe(document.getElementById('sentinel'));

    } catch(e) { console.log("Error inicializando app"); }
}

function parseM3U(t) {
    const list = [], lines = t.split('\n');
    let o = null;
    lines.forEach(l => {
        if(l.includes('#EXTINF:')) o = { title: l.split(',')[1]?.trim(), poster: l.match(/tvg-logo="([^"]+)"/)?.[1], type: 'tv' };
        else if(l.startsWith('http') && o) { o.video_url = l.trim(); list.push(o); o = null; }
    });
    return list;
}

function createCard(i) {
    const isFav = favs.includes(i.title);
    return `
        <div class="card" onclick="openPlayer('${i.title.replace(/'/g, "\\'")}')">
            <div class="fav-btn ${isFav?'active':''}" onclick="toggleFav(event, '${i.title.replace(/'/g, "\\'")}')">
                <i class="fas fa-heart"></i>
            </div>
            <img src="${i.poster || i.coverImage}" loading="lazy">
        </div>
    `;
}

function showView(v) {
    document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.menu a').forEach(x => x.classList.remove('active'));
    document.getElementById('m-'+(v==='favs'?'favs':v)).classList.add('active');
    
    if(v === 'home') document.getElementById('v-home').classList.add('active');
    else if(v === 'tv') {
        document.getElementById('v-tv').classList.add('active');
        document.getElementById('tv-grid').innerHTML = db.filter(i=>i.type==='tv').map(i => `
            <div class="card-tv" onclick="openPlayer('${i.title.replace(/'/g, "\\'")}')">
                <img src="${i.poster}" onerror="this.src='https://placehold.co/300x169/111/fff?text=${i.title}'">
            </div>
        `).join('');
    } else {
        document.getElementById('v-grid').classList.add('active');
        document.getElementById('main-grid').innerHTML = '';
        itemsCount = 0;
        if(v === 'series') { filtered = db.filter(i => i.episodes); document.getElementById('grid-title').innerText = "Series"; }
        else if(v === 'movies') { filtered = db.filter(i => !i.episodes && i.type !== 'tv'); document.getElementById('grid-title').innerText = "Películas"; }
        else if(v === 'favs') { filtered = db.filter(i => favs.includes(i.title)); document.getElementById('grid-title').innerText = "Mi Lista"; }
        renderBatch();
    }
    window.scrollTo(0,0);
}

function renderBatch() {
    const g = document.getElementById('main-grid');
    const chunk = filtered.slice(itemsCount, itemsCount + 30);
    chunk.forEach(i => {
        const d = document.createElement('div');
        d.innerHTML = createCard(i);
        g.appendChild(d.firstElementChild);
    });
    itemsCount += 30;
}

function openPlayer(title) {
    const item = db.find(x => x.title === title);
    const v = document.getElementById('vo');
    document.getElementById('player').style.display = 'block';
    document.getElementById('p-title').innerText = item.title;
    document.body.style.overflow = 'hidden';

    const saved = history[item.title] || { time: 0, ep: 0 };

    if(item.episodes) {
        document.getElementById('p-layout').classList.add('is-serie');
        document.getElementById('p-side').style.display = 'block';
        renderEpisodes(item, saved.ep);
        loadSource(item.episodes[saved.ep].video_url, saved.time);
    } else {
        document.getElementById('p-layout').classList.remove('is-serie');
        document.getElementById('p-side').style.display = 'none';
        loadSource(item.video_url, saved.time);
    }

    // Guardar progreso
    v.ontimeupdate = () => {
        if(Math.floor(v.currentTime) % 5 === 0) {
            history[item.title] = { time: v.currentTime, ep: item.episodes ? item.episodes.findIndex(e=>e.video_url===v.src) : 0 };
            localStorage.setItem('k_history', JSON.stringify(history));
        }
    };
}

function loadSource(url, time = 0) {
    const v = document.getElementById('vo');
    if(hls) hls.destroy();
    
    if(url.includes('.m3u8')) {
        if(Hls.isSupported()) {
            hls = new Hls(); hls.loadSource(url); hls.attachMedia(v);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { v.currentTime = time; v.play(); });
        } else { v.src = url; v.play(); }
    } else {
        v.src = url;
        v.onloadedmetadata = () => { v.currentTime = time; v.play(); };
    }
}

function renderEpisodes(item, activeIdx) {
    document.getElementById('ep-list').innerHTML = item.episodes.map((e, i) => `
        <div class="ep ${i===activeIdx?'active':''}" onclick="renderEpisodes(db.find(x=>x.title==='${item.title.replace(/'/g,"\\'")}'), ${i}); loadSource('${e.video_url}', 0)">
            <img src="${item.poster || item.coverImage}">
            <div><b>Episodio ${i+1}</b><br><small style="color:#666">${e.title || 'Reproducir'}</small></div>
        </div>
    `).join('');
}

function closePlayer() {
    document.getElementById('vo').pause();
    document.getElementById('player').style.display = 'none';
    document.body.style.overflow = 'auto';
}

function toggleSearch() {
    const s = document.getElementById('search-view');
    const input = document.getElementById('search-input');
    if(s.style.display === 'block') {
        s.style.display = 'none';
    } else {
        s.style.display = 'block';
        input.focus();
    }
}

function runSearch() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const results = db.filter(i => i.title.toLowerCase().includes(q));
    document.getElementById('search-results').innerHTML = results.slice(0, 20).map(i => createCard(i)).join('');
}

function toggleFav(e, title) {
    e.stopPropagation();
    if(favs.includes(title)) {
        favs = favs.filter(t => t !== title);
        notify("Eliminado de tu lista");
    } else {
        favs.push(title);
        notify("Añadido a tu lista");
    }
    localStorage.setItem('k_favs', JSON.stringify(favs));
    e.target.closest('.fav-btn').classList.toggle('active');
}

function notify(text) {
    const t = document.getElementById('toast');
    t.innerText = text;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

function playHero() { openPlayer(hHero.title); }

window.onscroll = () => {
    const h = document.getElementById('h');
    window.scrollY > 50 ? h.classList.add('scrolled') : h.classList.remove('scrolled');
};

start();
</script>
</body>
</html>
