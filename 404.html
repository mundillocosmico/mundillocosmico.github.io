<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clon de Netflix (Arreglado)</title>
    <style>
        /* === 1. Variables y Reset === */
        :root {
            --color-fondo: #141414;
            --color-texto: #ffffff;
            --color-primario: #e50914; /* Rojo Netflix */
            --padding-lateral: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            overflow-x: hidden; /* Evita el scroll horizontal general */
        }

        /* === 2. Estilos del Encabezado y Navegación === */
        header {
            padding: 20px var(--padding-lateral);
            background-color: var(--color-fondo);
        }

        .logo {
            color: var(--color-primario);
            font-size: 2em;
            font-weight: bold;
        }

        /* === 3. Estilos de Fila (Row) - El Corazón del Scroll === */
        .movie-row {
            padding: 20px 0;
            margin-bottom: 20px;
            position: relative;
        }

        .movie-row h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
            padding-left: var(--padding-lateral); /* Alinea el título */
        }

        /* Contenedor principal de la lista de películas */
        .row__list-container {
            position: relative;
            /* Oculta las flechas de scroll nativas, pero mantiene la funcionalidad */
            overflow: hidden; 
        }

        /* Lista de películas: la que se desplaza */
        .row__list {
            display: flex; /* **CLAVE 1: Disposición horizontal** */
            overflow-x: scroll; /* **CLAVE 2: Habilita el scroll horizontal** */
            overflow-y: hidden;
            padding-left: var(--padding-lateral);
            padding-right: var(--padding-lateral);
            /* Importante para un scroll suave al usar JS (o botones) */
            scroll-behavior: smooth;
            /* Truco para ocultar la barra de desplazamiento en algunos navegadores */
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }

        /* Oculta la barra de scroll en Webkit (Chrome, Safari) */
        .row__list::-webkit-scrollbar {
            display: none;
        }

        /* === 4. Estilos de "Caps" (Tarjetas de Película) === */
        .movie-cap {
            width: 280px; /* Ancho fijo para desktop */
            min-width: 280px; /* Evita que se encoja */
            height: 157.5px; /* Proporción 16:9 */
            border-radius: 4px;
            margin-right: 8px; /* Espacio entre "caps" */
            cursor: pointer;
            overflow: hidden;
            position: relative;
            /* **CLAVE 3: Transición para el efecto suave** */
            transition: transform 0.3s ease; 
        }

        .movie-cap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* **CLAVE 4: El efecto hover de escala/zoom** */
        .movie-cap:hover {
            transform: scale(1.05); /* Ligeramente más grande */
            z-index: 10; /* Se superpone a las vecinas */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* === 5. Responsive (Ajuste para móviles y tablets) === */
        @media (max-width: 900px) {
            :root {
                --padding-lateral: 20px;
            }
            .movie-cap {
                width: 200px; /* Más pequeñas en móviles */
                min-width: 200px;
                height: 112.5px;
            }
            .movie-row h2, header {
                padding-left: var(--padding-lateral);
                padding-right: var(--padding-lateral);
            }
        }
    </style>
</head>
<body>
