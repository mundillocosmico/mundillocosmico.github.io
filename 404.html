<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <title>KAWAII PLAY ULTIMATE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
    --primary: #E50914; 
    --bg: #050505; 
    --card-bg: #121212; 
    --text: #ffffff;
    --p-w: 180px;
    --p-h: 260px;
}

* { box-sizing: border-box; outline: none; }
body {
    margin: 0; font-family: 'Inter', sans-serif;
    background: var(--bg); color: var(--text); overflow-x: hidden;
}

h1, h2, h3, .logo, .nav-links a { font-family: 'Space Grotesk', sans-serif; }

/* --- HEADER --- */
header {
    height: 70px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 4%; position: fixed; top: 0; width: 100%; z-index: 2000;
    transition: 0.4s; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
}
header.scrolled { background: #000; border-bottom: 1px solid #222; }

.logo { color: var(--primary); font-size: 1.8rem; font-weight: 700; text-decoration: none; letter-spacing: -1.5px; }

.nav-links { display: flex; gap: 20px; align-items: center; }
.nav-links a { color: #b3b3b3; text-decoration: none; font-size: 0.9rem; cursor: pointer; transition: 0.3s; }
.nav-links a:hover, .nav-links a.active { color: #fff; }

/* BUSCADOR */
.search-container {
    background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px;
    display: flex; align-items: center; border: 1px solid transparent;
}
.search-container:focus-within { border-color: var(--primary); }
.search-container input { background: none; border: none; color: white; margin-left: 8px; font-size: 0.85rem; width: 140px; }

/* --- GRID Y PORTADAS --- */
.container { padding: 100px 4% 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--p-w), 1fr)); gap: 20px; }

.card { 
    background: var(--card-bg); border-radius: 8px; overflow: hidden; 
    cursor: pointer; position: relative; transition: 0.3s;
}
.card:hover { transform: translateY(-8px); }
.card img { width: 100%; height: var(--p-h); object-fit: cover; display: block; }

.card-title {
    padding: 12px; font-size: 0.85rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* BOTÓN FAVORITOS Y PROGRESO */
.fav-btn {
    position: absolute; top: 10px; right: 10px; z-index: 10;
    background: rgba(0,0,0,0.6); width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
}

.prog-cont { position: absolute; bottom: 42px; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.2); }
.prog-bar { height: 100%; background: var(--primary); }

/* --- REPRODUCTOR ESTILO YOUTUBE --- */
#player-screen {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 5000; overflow-y: auto;
}
.yt-layout { display: grid; gap: 25px; padding: 20px 4%; }
.yt-layout.is-serie { grid-template-columns: 1fr 380px; }
.yt-layout.is-movie { grid-template-columns: 1fr; }

.video-main video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; }

/* LISTA DE CAPÍTULOS */
.side-list {
    background: #0f0f0f; border-radius: 12px; padding: 15px;
    height: 75vh; overflow-y: auto; border: 1px solid #222;
}
.side-item {
    display: flex; gap: 12px; margin-bottom: 12px; padding: 8px;
    border-radius: 8px; cursor: pointer; align-items: center;
}
.side-item:hover { background: #1a1a1a; }
.side-item.active { background: #222; border: 1px solid var(--primary); }

/* MINIATURAS CAPÍTULOS IGUALES */
.side-item img { width: 120px; height: 68px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
.side-item-info { overflow: hidden; }
.side-item-info h4 { 
    margin: 0; font-size: 0.85rem; color: #fff; 
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
}

.close-p { padding: 20px 4%; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 700; color: #ccc; }

@media (max-width: 1100px) {
    .yt-layout.is-serie { grid-template-columns: 1fr; }
    .side-list { height: auto; }
}
</style>
</head>
<body>

<header id="main-nav">
    <div style="display:flex; align-items:center; gap:30px;">
        <a href="#" class="logo">KAWAII</a>
        <nav class="nav-links">
            <a onclick="filterData('all')" id="n-all" class="active">Inicio</a>
            <a onclick="filterData('series')" id="n-series">Series</a>
            <a onclick="filterData('movies')" id="n-movies">Películas</a>
            <a onclick="filterData('tv')" id="n-tv">TV</a>
            <a onclick="filterData('favs')" id="n-favs"><i class="fas fa-heart"></i></a>
        </nav>
    </div>
    <div class="search-container">
        <i class="fas fa-search" style="color:#777; font-size:0.8rem;"></i>
        <input type="text" id="searchInput" placeholder="Buscar..." oninput="handleSearch()">
    </div>
</header>

<main class="container">
    <h2 id="section-title" style="margin-bottom:25px;">Novedades</h2>
    <div id="grid" class="grid"></div>
</main>

<div id="player-screen">
    <div class="close-p" onclick="closePlayer()"><i class="fas fa-arrow-left"></i> VOLVER</div>
    <div id="player-layout" class="yt-layout">
        <div class="video-main">
            <video id="main-video" controls playsinline></video>
            <h2 id="v-title" style="margin-top:20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></h2>
        </div>
        <div id="side-box" class="side-list">
            <h3 style="font-size:1rem; margin-bottom:15px;">Capítulos</h3>
            <div id="ep-list"></div>
        </div>
    </div>
</div>

<script>
const APIS = {
    DATA: "https://raw.githubusercontent.com/R3D-GHOST/json/refs/heads/main/data.json",
    TV: "https://raw.githubusercontent.com/R3D-GHOST/json/refs/heads/main/CV.m3u8"
};

let db = [], filtered = [], hls = null;
let currentItem = null, currentEpIdx = 0;
let favorites = JSON.parse(localStorage.getItem('kawaii_favs') || '[]');

const Memory = {
    save: (id, epIdx, time, dur) => {
        let h = JSON.parse(localStorage.getItem('kawaii_progress') || '{}');
        h[id] = { epIdx, time, per: (time/dur)*100 };
        localStorage.setItem('kawaii_progress', JSON.stringify(h));
    },
    get: (id) => JSON.parse(localStorage.getItem('kawaii_progress') || '{}')[id]
};

async function init() {
    const [d1, d2] = await Promise.all([
        fetch(APIS.DATA).then(r => r.json()),
        fetch(APIS.TV).then(r => r.text())
    ]);
    db = [...d1, ...parseM3U(d2)];
    filtered = db;
    render();
}

function parseM3U(t) {
    const res = [], lines = t.split('\n');
    let item = null;
    lines.forEach(l => {
        if (l.includes('#EXTINF:')) item = { title: l.split(',')[1] || "Canal TV", poster: l.match(/tvg-logo="([^"]+)"/)?.[1], type: 'tv' };
        else if (l.startsWith('http') && item) { item.video_url = l.trim(); res.push(item); item = null; }
    });
    return res;
}

function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    filtered.forEach(item => {
        const mem = Memory.get(item.title);
        const isFav = favorites.includes(item.title);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="fav-btn" onclick="toggleFav(event, '${item.title}')">
                <i class="${isFav ? 'fas' : 'far'} fa-heart" style="color:${isFav ? '#E50914' : '#fff'}"></i>
            </div>
            <img src="${item.poster || item.coverImage}" loading="lazy">
            ${mem ? `<div class="prog-cont"><div class="prog-bar" style="width:${mem.per}%"></div></div>` : ''}
            <div class="card-title">${item.title}</div>
        `;
        card.onclick = () => openPlayer(item);
        grid.appendChild(card);
    });
}

function openPlayer(item) {
    currentItem = item;
    const screen = document.getElementById('player-screen');
    const layout = document.getElementById('player-layout');
    const epCont = document.getElementById('ep-list');
    const mem = Memory.get(item.title);
    
    screen.style.display = 'block';
    document.body.style.overflow = 'hidden';
    document.getElementById('v-title').innerText = item.title;

    if (item.episodes) {
        layout.className = 'yt-layout is-serie';
        document.getElementById('side-box').style.display = 'block';
        epCont.innerHTML = '';
        currentEpIdx = mem ? mem.epIdx : 0;
        item.episodes.forEach((ep, i) => {
            const div = document.createElement('div');
            div.className = `side-item ${i === currentEpIdx ? 'active' : ''}`;
            div.innerHTML = `
                <img src="${item.poster || item.coverImage}">
                <div class="side-item-info"><h4>${i+1}. ${ep.title || 'Capítulo'}</h4></div>
            `;
            div.onclick = () => { 
                currentEpIdx = i; play(ep.video_url, 0); 
                document.querySelectorAll('.side-item').forEach((s,idx)=>s.classList.toggle('active', idx===i));
            };
            epCont.appendChild(div);
        });
        play(item.episodes[currentEpIdx].video_url, mem ? mem.time : 0);
    } else {
        layout.className = 'yt-layout is-movie';
        document.getElementById('side-box').style.display = 'none';
        play(item.video_url, mem ? mem.time : 0);
    }
}

function play(url, start) {
    const v = document.getElementById('main-video');
    if (hls) hls.destroy();
    const ready = () => { v.currentTime = start; v.play(); };
    if (url.includes('.m3u8')) {
        if (Hls.isSupported()) { hls = new Hls(); hls.loadSource(url); hls.attachMedia(v); hls.on(Hls.Events.MANIFEST_PARSED, ready); }
        else { v.src = url; v.onloadedmetadata = ready; }
    } else { v.src = url; v.onloadedmetadata = ready; }
}

function toggleFav(e, title) {
    e.stopPropagation();
    if (favorites.includes(title)) favorites = favorites.filter(t => t !== title);
    else favorites.push(title);
    localStorage.setItem('kawaii_favs', JSON.stringify(favorites));
    render();
}

function handleSearch() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    filtered = db.filter(i => i.title.toLowerCase().includes(q));
    render();
}

function filterData(cat) {
    document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
    document.getElementById('n-'+cat).classList.add('active');
    if(cat==='all') filtered = db;
    else if(cat==='series') filtered = db.filter(i => i.episodes);
    else if(cat==='movies') filtered = db.filter(i => i.video_url && !i.episodes && i.type !== 'tv');
    else if(cat==='tv') filtered = db.filter(i => i.type === 'tv');
    else if(cat==='favs') filtered = db.filter(i => favorites.includes(i.title));
    render();
}

setInterval(() => {
    const v = document.getElementById('main-video');
    if (!v.paused && currentItem && v.duration > 0) Memory.save(currentItem.title, currentEpIdx, v.currentTime, v.duration);
}, 5000);

function closePlayer() {
    document.getElementById('main-video').pause();
    document.getElementById('player-screen').style.display = 'none';
    document.body.style.overflow = 'auto';
    render();
}

window.onscroll = () => {
    const n = document.getElementById('main-nav');
    if (window.scrollY > 50) n.classList.add('scrolled'); else n.classList.remove('scrolled');
};

init();
</script>
</body>
</html>
